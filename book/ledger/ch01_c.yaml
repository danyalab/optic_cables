  - id: ch01.amp.caves_half_quantum_limit
    section: "1.5"
    claim: "A high-gain phase-insensitive linear amplifier must add input-referred noise at least equal to the half-quantum of zero-point fluctuations (origin of the 3 dB NF limit)"
    value: "added noise >= half-quantum (hbar*omega/2) referred to input, high-gain limit"
    unit: "1"
    kind: fact
    conditions:
      note: "phase-insensitive amplifier, single-mode and multimode analyses"
    source_id: caves_prd_1982
    locator: "Abstract"
    quote: 'in the limit of high gain, to add noise which, referred to the input, is at least as large as the half-quantum of zero-point fluctuations'
    retrieved: 2026-11-02
    tier: A
    confidence: med
    notes: "Abstract only (APS paywall). Translation into F >= 2 (3 dB) for the optical NF definition comes from Desurvire/Carney records below."

