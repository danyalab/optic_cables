  verified: match
- id: ch02.nyq.min_spacing_equals_rs
  section: '2.1'
  claim: Minimum Nyquist-WDM channel spacing with potentially no penalty versus ideal matched filtering equals the symbol
    rate
  value: 1.0
  unit: R_s
  kind: fact
  conditions:
    note: ideal rectangular/raised-cosine Nyquist spectrum
  source_id: bosco_ofc_2012
  locator: Slide 'The Nyquist spectrum'
  quote: The minimum channel spacing with potentially no penalty with respect to the ideal matched filter case is equal to
    the symbol-rate Rs
  retrieved: 2026-11-02
  tier: B
  confidence: med
  notes: 'Tutorial slides accompanying OFC 2012 OM3H.1; same slides use square-root raised cosine with roll-off 0.05 at spacing
    1.1 Rs for 14-GBd PM-16QAM. Verifier (UNREACHABLE): not re-read in this verification pass (session budget; source not
    opened); re-verify before prose use Bosco OFC 2012 slides are tier B; tier-A candidate Bosco et al., JLT 29(1) 53-61 (2011)
    not read. Verifier (PARTIAL): Value, quote, locator verified. Fix source title: slides are titled ''Spectral Shaping in
    Ultra-Dense WDM Systems: Optical vs. Electrical Approaches'' (not ''Nyquist-WDM: optimization of pulse and filter shape'',
    which is PDF metadata). Tier B correct; tier-A Bosco et al. JLT 29(1) 2011 still unread.'
  verified: partial
