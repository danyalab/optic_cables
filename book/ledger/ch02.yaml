records:
- id: ch02.nyq.rc_bandwidth
  section: '2.1'
  claim: Occupied (two-sided) bandwidth of a raised-cosine shaped signal is 2(1+β)W with symbol interval T0 = 1/(2W), i.e.
    (1+β)/T0 = (1+ρ)R_s
  value: 2(1+β)W, with T0 = 1/(2W)
  unit: Hz
  kind: fact
  conditions:
    note: β is the roll-off factor (book symbol ρ); W is the Nyquist one-sided bandwidth; so B = (1+ρ)R_s with R_s = 1/T0
  source_id: ishihara_access_2021
  locator: Sect. II, text following Eqs. (18)-(19)
  quote: the bandwidth of an RC shaping filter is given by 2(1 + β)W , where β denotes a roll-off factor
  retrieved: 2026-11-02
  tier: A
  confidence: high
  notes: Wireless/general comms review, not optics-specific; the formula is generic. Equation record ch02.eq.rc_spectrum carries
    the spectrum.
  verified: match
- id: ch02.nyq.rc_rolloff_zero_rect
  section: '2.1'
  claim: Raised-cosine filter with roll-off 0 reduces to the rectangular (sinc-pulse) Nyquist filter
  value: 0
