- id: ch03.las.henry_excess_ratio
  section: '3.1'
  claim: Ratio of measured linewidth to the prediction of pre-1982 (Schawlow-Townes-type) theories
  value: 30
  unit: '1'
  kind: measured
  conditions:
    material: AlGaAs
  source_id: henry_jqe_1982
  locator: Abstract
  quote: This value is 30 times greater than can be explained by existing theories.
  retrieved: 2026-11-02
  tier: A
  confidence: med
  notes: Motivates the (1+alpha^2) factor; 1+5.4^2 = 30.2, consistent with the factor of 30.
  verified: match
- id: ch03.las.vcsel_alpha_range
  section: '3.1'
  claim: Typical range of the linewidth enhancement factor alpha_H reported for VCSELs (sign convention of the chapter)
  value:
  - -7
  - -2
  unit: '1'
  kind: spec_typ
  conditions:
    device: oxide-confined VCSEL, 850-980 nm
  source_id: michalzik_ebeling_vcsel_chapter_2003
  locator: Sect. 4.4, text after Eq. (68)
  quote: where alpha_H is the linewidth enhancement factor that has also been determined for VCSELs [64] and typically takes
    values between -2 and -7.
  retrieved: 2026-11-02
  tier: A
  confidence: high
  notes: Negative sign follows the chapter's convention; Henry defines alpha = dn'/dn'' and quotes positive values. Use |alpha_H|
    = 2 to 7 in prose and state the convention.
  verified: match
