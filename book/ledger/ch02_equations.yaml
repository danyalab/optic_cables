- id: ch02.eq.awgn_capacity
  section: '2.5'
  latex: C = \tfrac{1}{2}\log_2(1+\mathrm{SNR})\ \text{bit per real dimension};\qquad C = \log_2(1+\mathrm{SNR})\ \text{bit
    per complex symbol}
  symbols:
  - C
  - \mathrm{SNR}
  source_id: bocherer_tcom_2015
  locator: Abstract; Sect. VII (Conclusions)
  notes: 'Both forms are printed (real-ASK abstract and complex-QAM conclusion ''log2(1+P/1)''). C and SNR already in notation.yaml
    (1.6, 1.5). Verifier (PARTIAL): Real-dimension form verified as Eq. (1) (add to locator). Complex-symbol form is the trivial
    doubling; Conclusions sentence not re-seen.'
  verified: partial
- id: ch02.eq.mb_distribution
  section: '2.5'
  latex: P_{X_\nu}(x) = A_\nu e^{-\nu|x|^2}, \qquad A_\nu = \frac{1}{\sum_{x'\in\mathcal{X}} e^{-\nu|x'|^2}}
  symbols:
  - \nu
  source_id: bocherer_tcom_2015
  locator: Eq. (8)
  notes: 'CONFLICT - ν is optical frequency in notation.yaml (1.5). Cho & Winzer Eq. (4) use λ (also clashes with wavelength).
    Propose a new symbol (e.g. \lambda_{\mathrm{MB}} or \kappa) in book/notation/ch02_proposals.yaml. ν chosen so that E|ΔX|²
    = P (Eq. 9). Verifier (UNREACHABLE): not re-read in this verification pass (session budget; source not opened); re-verify
    before prose use'
  verified: unreachable
- id: ch02.eq.entropy
  section: '2.5'
  latex: H(X) = -\sum_{x\in\mathcal{X}} P_X(x)\log_2 P_X(x)
  symbols:
  - H
  source_id: cho_jlt_2019
  locator: Sect. II, text after Eq. (4)
  notes: 'Per-dimension entropy; the 2D PS-QAM entropy is 2H(X). Cho & Winzer call it ''binary entropy'' loosely; it is the
    Shannon entropy in bits. Verifier (PARTIAL): Per-dimension entropy usage confirmed; explicit definition sentence not re-seen.'
  verified: partial
- id: ch02.eq.pas_rate
  section: '2.5'
  latex: \mathrm{IR} = 2\left(H(X) - m(1-R_c)\right)
  symbols:
  - H
  - m
  - R_c
  source_id: cho_jlt_2019
  locator: Eq. (5)
  notes: Bits per 2D symbol; m = log2 of the PAM order per dimension (bits per dimension); R_c FEC code rate. Requires symmetric
    MB distribution and systematic FEC with parity used as sign bits.
  verified: match
- id: ch02.eq.pas_code_rate
  section: '2.5'
  latex: R_c = 1 - \frac{H(X) - \mathrm{IR}/2}{m}
  symbols:
  - R_c
  - H
  - m
  source_id: cho_jlt_2019
  locator: Eq. (6)
  notes: 'Inverse of Eq. (5). Verifier (PARTIAL): Eq. (6) is the inverse of Eq. (5) as stated; typeset form not seen but algebra
    is correct.'
  verified: partial
- id: ch02.eq.shaping_gain_ultimate
  section: '2.5'
  latex: G_{s}^{\max} = 10\log_{10}\frac{\pi e}{6} \approx 1.53\ \mathrm{dB}
  symbols: []
  source_id: bocherer_tcom_2015
  locator: Sect. III-D
  notes: Ratio of the power of a uniform (cube) input to a Gaussian input at equal entropy, high-SNR limit; Böcherer cites
    Forney et al. 1984 [13, Sec. IV.B]. Derive in prose from differential entropies of uniform and Gaussian densities.
  verified: match
