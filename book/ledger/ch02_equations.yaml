equations:
- id: ch02.eq.rc_spectrum
  section: '2.1'
  latex: H_{\mathrm{RC}}(f) = \begin{cases} T_0, & |f| \le \frac{1-\rho}{2T_0} \\ \frac{T_0}{2}\left[1 + \cos\left(\frac{\pi
    T_0}{\rho}\left(|f| - \frac{1-\rho}{2T_0}\right)\right)\right], & \frac{1-\rho}{2T_0} < |f| \le \frac{1+\rho}{2T_0} \\
    0, & |f| > \frac{1+\rho}{2T_0} \end{cases}
  symbols:
  - \rho
  - T_0
  - f
  source_id: ishihara_access_2021
  locator: Eq. (18)
  notes: Source uses beta for the roll-off; book symbol is rho (proposal, not yet in notation.yaml). Extraction garbled the
    piecewise layout; the form above is the standard RC spectrum consistent with the printed band edges (1-β)/2T0 and (1+β)/2T0.
    T_0 = 1/R_s. Note f here is baseband frequency (notation.yaml f).
  verified: match
- id: ch02.eq.rc_impulse
  section: '2.1'
  latex: g(t) = \mathrm{sinc}\left(\frac{t}{T_0}\right)\frac{\cos(\rho\pi t/T_0)}{1 - (2\rho t/T_0)^2}
  symbols:
  - \rho
  - T_0
  source_id: ishihara_access_2021
  locator: Eq. (19)
  notes: Extraction shows 'sinc t T0 cos βπt T0 1 -4 βt T0 2'; the denominator 1-4β²t²/T0² = 1-(2βt/T0)². Verify against PDF.
    Root-raised-cosine pair given in Eq. (20).
  verified: match
- id: ch02.eq.rc_bandwidth
  section: '2.1'
  latex: B = (1+\rho) R_s
  symbols:
  - B
  - \rho
  - R_s
  source_id: ishihara_access_2021
  locator: Sect. II, text after Eq. (19)
  notes: Source states 'the bandwidth of an RC shaping filter is given by 2(1+β)W' with T0 = 1/(2W); substituting W = R_s/2
    gives (1+ρ)R_s (two-sided passband occupancy of the optical field). Proposed symbol B for occupied bandwidth; B_ch in
    notation.yaml is the channel bandwidth.
  verified: match
- id: ch02.eq.bit_rate
  section: '2.1'
  latex: R_b = N_{\mathrm{pol}}\, R_s \log_2(M)\, R_c \quad(\text{uniform QAM}); \qquad R_b = N_{\mathrm{pol}}\, R_s\, \mathrm{IR}
    \quad(\text{PAS})
  symbols:
  - R_b
  - N_{\mathrm{pol}}
  - R_s
  - M
  - R_c
  source_id: cho_jlt_2019
  locator: Eq. (5) with H(X) = m (uniform, lambda = 0)
  notes: 'DERIVED, not printed in this form. Cho & Winzer Eq. (5) gives IR = 2(H(X) - m(1 - R_c)) bit per 2D symbol; for uniform
    M-QAM, H(X) = m = log2(M)/2 per dimension, so IR = log2(M) R_c per polarization; multiply by R_s and N_pol. Check case
    400ZR, ch02.sym.400zr_line_rate (2 x 59.84375 GBd x 4 = 478.75 Gb/s gross). Verifier (PARTIAL): Derivation correct; 400ZR
    check 2 x 59.84375 x 4 = 478.75 Gb/s verified. For 400ZR, R_c must absorb pilot, FAW/TS and framing overheads (Table 14),
    not only FEC; say so.'
  verified: partial
- id: ch02.eq.pam_penalty
  section: '2.2'
  latex: \Delta_{\mathrm{PAM}\text{-}M}^{\mathrm{opt}} = 10\log_{10}(M-1)\ \mathrm{dB}, \qquad \Delta_{\mathrm{QAM}\text{-}M}^{\mathrm{opt}}
    = 10\log_{10}(\sqrt{M}-1)\ \mathrm{dB}
  symbols:
  - M
  source_id: cole_ieee8023bs_2014
  locator: Slide 'PAM, QAM SNR Modulation Penalty'
  notes: Optical-dB penalty at equal OMA. In electrical SNR the penalty is 20 log10(M-1) (9.54 dB for PAM4); see ch02.imdd.pam4_penalty_electrical
    and ch02.imdd.pamn_eye_height (Pang JLT 2020, eye height reduced by N-1).
  verified: match
- id: ch02.eq.tdecq
  section: '2.2'
  latex: \mathrm{TDECQ} = 10\log_{10}\left(\frac{\mathrm{OMA}_{\mathrm{outer}}}{6\,Q_t\,\sqrt{\sigma_G^2+\sigma_S^2}}\right),
    \quad Q_t = 3.414
  symbols:
  - \mathrm{OMA}_{\mathrm{outer}}
  - Q_t
  - \sigma_G
  - \sigma_S
  source_id: cole_ieee8023cu_2019
  locator: Slide 'TDECQ, Ceq 121.8.5 Definition' (quotes IEEE 802.3 Eqs. (121-11), (121-12))
  notes: DISAGREEMENT in R. Cole (quoting the published 121-11) gives R = sqrt(σG² + σS²). The earlier draft text in King
    3bs 2016 printed R = (Ceq σG² + σS²)^½. Dawe 3cd 2018 writes σG = σeq/Ceq so TDECQ = 10log10(OMA/(6 Qt σeq)) + 10log10(Ceq).
    Use the published form; verify against IEEE 802.3-2022 clause 121.8.5.3.
  verified: match
- id: ch02.eq.tdecq_minus_ceq
  section: '2.2'
  latex: \mathrm{TDECQ} = 10\log_{10}\left(\frac{\mathrm{OMA}_{\mathrm{outer}}}{6\,Q_t\,\sigma_{\mathrm{eq}}}\right) + 10\log_{10}
    C_{\mathrm{eq}}
  symbols:
  - \mathrm{OMA}_{\mathrm{outer}}
  - Q_t
  - C_{\mathrm{eq}}
  source_id: dawe_ieee8023cd_2018
  locator: Slide 'In algebra'
  notes: With σS set to 0; σeq is the noise that could be added after the ideal reference equalizer; Ceq the noise enhancement
    coefficient. Splits TDECQ into 'how bad' and 'cost of equalizing'.
  verified: match
- id: ch02.eq.mpi_penalty_bound
  section: '2.2'
  latex: \mathrm{PP}_{\mathrm{MPI}} = 10\log_{10}\frac{1}{1-x}, \qquad x = (m-1)\,4NR\,\frac{E}{E-1}
  symbols:
  - m
  - N
  - R
  - E
  source_id: bhatt_ieee8023bs_2016
  locator: Slides deriving 'MPI Penalty, dB'
  notes: m = number of PAM levels, N = number of interferer pairs, R = product reflectance per path, E = extinction ratio
    (linear). Upper bound (worst-case phase, aligned polarization). Discounted version multiplies x by D (0 < D <= 1; 0.4
    to 0.8 suggested). Extraction garbled the fraction 'E E− 1'; reconstructed from OMAinner = (Am²-A1²)/(m-1) and peak-to-peak
    noise 4NRAm². R here clashes with responsivity R; rename in prose.
  verified: match
- id: ch02.eq.balanced_output
  section: '2.3'
  latex: I(t) = I_1(t) - I_2(t) = 2R\sqrt{P_s(t)P_{\mathrm{LO}}}\cos\{\omega_{\mathrm{IF}}t + \theta_{\mathrm{sig}}(t) - \theta_{\mathrm{LO}}(t)\}
  symbols:
  - R
  - P_s
  - P_{\mathrm{LO}}
  - \omega_{\mathrm{IF}}
  source_id: kikuchi_jlt_2016
  locator: Eq. (13), with Eqs. (8)-(12)
  notes: Square root lost in extraction but the text states the current 'is proportional to √P'. R = qη/(ħω_s) is the photodiode
    responsivity (Eq. 12); R is a new symbol (proposal). Source writes P_LO as P with subscript LO glyph dropped.
  verified: match
- id: ch02.eq.hybrid_outputs
  section: '2.3'
  latex: E_{1,2} = \tfrac{1}{2}(E_s \pm E_{\mathrm{LO}}),\ E_{3,4} = \tfrac{1}{2}(E_s \pm iE_{\mathrm{LO}});\quad I_I(t) =
    R\sqrt{P_sP_{\mathrm{LO}}}\cos\{\theta_{\mathrm{sig}}(t)-\theta_{\mathrm{LO}}(t)\},\ I_Q(t) = R\sqrt{P_sP_{\mathrm{LO}}}\sin\{\theta_{\mathrm{sig}}(t)-\theta_{\mathrm{LO}}(t)\}
  symbols:
  - R
  - P_s
  - P_{\mathrm{LO}}
  source_id: kikuchi_jlt_2016
  locator: Eqs. (18)-(23)
  notes: '2x4 90-degree hybrid followed by two balanced photodiodes (phase-diversity homodyne). The 1/2 field factors and
    the loss of the factor 2 relative to Eq. (13) reflect the 4-way split. Square roots dropped in extraction (''R PsP cos'').
    Verifier (UNREACHABLE): not re-read in this verification pass (session budget; source not opened); re-verify before prose
    use'
  verified: unreachable
- id: ch02.eq.complex_baseband
  section: '2.3'
  latex: I_c(t) = I_I(t) + iI_Q(t) = R\sqrt{P_s(t)P_{\mathrm{LO}}}\exp[i\{\theta_s(t) + \theta_n(t)\}]
  symbols:
  - R
  - P_s
  - P_{\mathrm{LO}}
  source_id: kikuchi_jlt_2016
  locator: Eq. (24)
  notes: 'θ_n is the combined laser phase noise. Recovers the complex field up to phase noise; dual-polarization recovery
    uses two such receivers with a polarization-diversity front end. Verifier (UNREACHABLE): not re-read in this verification
    pass (session budget; source not opened); re-verify before prose use'
  verified: unreachable
- id: ch02.eq.shot_noise
  section: '2.3'
  latex: \langle \Delta \hat I^2 \rangle = 2qIB, \qquad B = \frac{1}{2T}
  symbols:
  - q
  - I
  - B
  - T
  source_id: kikuchi_jlt_2016
  locator: Eqs. (35)-(36)
  notes: Shot-noise formula derived from coherent-state photon statistics; B is the minimum (Nyquist) bandwidth for symbol
    duration T. Conflicts with B for occupied bandwidth in ch02.eq.rc_bandwidth; writer should use B_n for noise bandwidth.
  verified: match
- id: ch02.eq.lo_shot_psd
  section: '2.3'
  latex: S_{I_{\mathrm{sh}}}(f) = qRP_{\mathrm{LO}} \quad (P_{\mathrm{LO}} \gg P_s,\ \text{two-sided})
  symbols:
  - q
  - R
  - P_{\mathrm{LO}}
  source_id: ip_oe_2008
  locator: Sect. 3.3, text after Eq. (7)
  notes: Together with signal current 2R sqrt(P_s P_LO), gives the LO-shot-noise-limited SNR proportional to P_s and independent
    of P_LO; derive in prose.
  verified: match
- id: ch02.eq.cd_taps_ip
  section: '2.4'
  latex: N_{\mathrm{CD}} = 2\pi|\beta_2| L R_s^2 \left(\frac{M}{K}\right)^2
  symbols:
  - N_{\mathrm{CD}}
  - \beta
  - L
  - R_s
  source_id: ip_oe_2008
  locator: Sect. 5.1, text after Eq. (33) (from Ip and Kahn JLT 2007)
  notes: 'M/K is the rational oversampling ratio (samples per symbol); conflicts with M = constellation order, rename to n_ss
    in prose. Extraction ''N LRs ( ) M K 2 2 = 2π β''. Equivalent to Savory''s truncated-impulse-response bound N = 2 floor(|D|
    λ² z /(2 c T²)) + 1 with T the sample period and D = -2πcβ2/λ² (that form was seen only in secondary transcriptions; see
    gaps). Verifier (PARTIAL): Formula verified; fix locator to Eq. (35) (not ''after Eq. (33)''). Equivalence to Savory''s
    N = 2⌊|D|λ²z/(2cT²)⌋+1 holds with D = -2πcβ2/λ² and T = (K/M)Ts (both ~ 2π|β2|z/T²).'
  verified: partial
- id: ch02.eq.td_eq_complexity
  section: '2.4'
  latex: C_{\mathrm{TD}} = 4NR_s \ \ \text{complex multiplications per second}
  symbols:
  - N
  - R_s
  source_id: ip_oe_2008
  locator: Sect. 5.1
  notes: 'Dual-polarization 2x2 butterfly with N taps per filter, one output per symbol. Divide by the net bit rate for multiplications
    per bit. Verifier (PARTIAL): Fix locator to Sect. 5.1.4.'
  verified: partial
- id: ch02.eq.fde_complexity
  section: '2.4'
  latex: C_{\mathrm{FD}} = R_s\,\frac{(N+B-1)\left[2\log_2(N+B-1) + 4\right]}{B} \ \ \text{complex multiplications per second}
  symbols:
  - N
  - R_s
  source_id: ip_oe_2008
  locator: Sect. 5.1
  notes: 'Overlap-save FFT block processing with block length B (here B is block length, not bandwidth). Extraction ''Rs (
    ) ( ) N + B −1 ( ) 2log2 N + B −1 + 4 B'' leaves the placement of B ambiguous; division by B is required dimensionally
    (per-symbol cost). VERIFY against PDF. Ip states asymptotic growth R_s² log R_s. Verifier (PARTIAL): Glyph order consistent
    with division by B (only dimensionally valid reading); still confirm against typeset PDF. Fix locator to 5.1.4.'
  verified: partial
- id: ch02.eq.lms_mmse
  section: '2.4'
  latex: \mathbf{W}_{\mathrm{opt}} = \mathbf{A}^{-1}\boldsymbol{\alpha}, \quad \mathbf{A} = E[\mathbf{y}_k\mathbf{y}_k^{H}],\
    \boldsymbol{\alpha} = E[\mathbf{y}_k\mathbf{x}_k^{H}]
  symbols: []
  source_id: ip_oe_2008
  locator: Eq. (32)
  notes: 'Wiener (MMSE) solution for an N = 2L+1 tap fractionally spaced 2x2 equalizer; the adaptive LMS update that follows
    in Ip (Eq. 34) was not captured in extraction. Extraction shows ''A = E[y_k y_k^*T]'' and ''α = E[y_k x_k^*T]''; conjugate-transpose
    convention to be checked. Verifier (PARTIAL): Definitions confirmed (^{*T} = Hermitian, matches ledger ^H). W_opt = A^{-1}α
    form not re-seen; K separate Wiener solutions for non-integer M/K (e.g. 3/2).'
  verified: partial
