  unit: dB/km
  kind: spec_max
  conditions:
    wavelength_nm:
    - 1310
    - 1625
    fiber: G.652.D
    note: cable attribute; not applied to short jumper/indoor/drop cables (Note 1)
  source_id: itu_t_g652_2024
  locator: Clause 8, Table 2 (ITU-T G.652.D attributes), cable attributes, row 'Attenuation coefficient'
  quote: Attenuation coefficient (Note 1) | Maximum from 1310 nm to 1625 nm (Note 2) | 0.40 | dB/km
