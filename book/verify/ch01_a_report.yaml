    citation: "S. Sato, Y. Kawaguchi, H. Sakuma, T. Haruna, T. Hasegawa, 'Silica-Core Single-Mode Fiber With Lowest Loss of 0.1397 dB/km', J. Lightwave Technol. 43(4), 1837- (2025), doi:10.1109/JLT.2025.3527933"
    url: "https://opg.optica.org/jlt/abstract.cfm?uri=jlt-43-4-1837"
