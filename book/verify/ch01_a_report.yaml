tier_a_replacements:
  - for: ch01.eq.maxwellian_dgd_pdf
    citation: "ITU-T Recommendation G.650.2 (08/2015), Definitions and test methods for statistical and non-linear related attributes of single-mode fibre and cable, Appendix IV.4"
    url: "https://www.itu.int/rec/dologin_pub.asp?id=T-REC-G.650.2-201508-I!!PDF-E&lang=s&type=items"
    locator: "Appendix IV, clause IV.4, Eqs. (IV-3) and (IV-4) (Excel form: PJ = 1-GAMMADIST(4*PMAX*PMAX/(PI()*ZI*ZI),1.5,1,TRUE))"
    value: "P(DGD > DGDmax) = 1 - Gamma_cdf(4 DGDmax^2 / (pi <DGD>^2); shape 3/2, scale 1), which is the tail of p(dtau) = 32 dtau^2/(pi^2 <dtau>^3) exp(-4 dtau^2/(pi <dtau>^2))"
    note: "Tier A standard; gives the Maxwellian in integrated (tail) form, not the pdf itself. Complement with G.652 (08/2024) clause I.3 statement that link DGD varies as a single-parameter Maxwell distribution."
  - for: ch01.eq.maxwellian_dgd_pdf
    citation: "G. J. Foschini and C. D. Poole, 'Statistical theory of polarization dispersion in single mode fibers', J. Lightwave Technol. 9(11), 1439-1456 (1991), doi:10.1109/50.97630"
    url: "https://doi.org/10.1109/50.97630"
    locator: "not verified (paywalled; full text not reachable from this session)"
