summary:
  checked: 143
  match: 132
  mismatch: 1
  partial: 10
  unreachable: 0
  tier_c_records: 40
  tier_c_note: 'All 40 tier-C records are company/IXP/press claims (Lumen PR and Lightwave, Zayo, DE-CIX, Nokia, carrier-hotel pages, Microsoft blog/Source, SDxCentral, Verizon earnings release). All have
    confidence low. None is a physics or engineering constant; all are suitable for contested/company-claims boxes. Risk: syllabus 8.1 carrier comparison and IXP scale would rest on tier C (Zayo, DE-CIX);
    the writer must keep them inside boxes. fairwater_gpu_bw (800 Gb/s) and lumen_retained_backbone are the two most likely to leak into prose.'
